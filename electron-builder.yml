appId: io.github.sojuse.qclod
productName: Qclod
copyright: Copyright © 2026 SOJuse

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The SDK spawns the user's own claude executable as a child process and reads
# its own files from node_modules, so it must stay outside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # No code signing: the spec ships an unsigned installer.
  signAndEditExecutable: false

portable:
  artifactName: Qclod.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Qclod
  artifactName: Qclod-${version}-setup.${ext}
  uninstallDisplayName: Qclod
  installerLanguages: [ru_RU]
  language: '1049'
  multiLanguageInstaller: false
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  runAfterFinish: true
  deleteAppDataOnUninstall: false

# Updates come from public GitHub releases. releaseType must be "release":
# the default is a draft, and electron-updater does not see drafts.
publish:
  provider: github
  owner: SOJuse
  repo: qclod
  releaseType: release

# macOS arrives in stage 6; the icon is ready for it.
mac:
  icon: build/icon.icns
