appId: io.github.sojuse.qclod
productName: Qclod
copyright: Copyright © 2026 noreply

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The SDK spawns the user's own claude executable as a child process and reads
# its own files from node_modules, so it must stay outside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  # No code signing: the spec ships an unsigned installer.
  signAndEditExecutable: false

portable:
  artifactName: Qclod.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Qclod
  artifactName: Qclod-${version}-setup.${ext}

# The spec has no auto-update: a new version is a new installer, downloaded
# by hand.
publish: null
