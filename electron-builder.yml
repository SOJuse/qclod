appId: io.github.sojuse.qclod
productName: Qclod
copyright: Copyright © 2026 noreply

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - bin/**/*
  - package.json
  - '!**/*.map'

# ELECTRON_RUN_AS_NODE cannot read a script out of an asar archive, and the
# hook helper is launched that way by Claude Code. See hookLauncher.ts.
asarUnpack:
  - bin/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  # No code signing: the spec ships an unsigned installer.
  signAndEditExecutable: false

portable:
  artifactName: Qclod.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Qclod
  artifactName: Qclod-${version}-setup.${ext}

# The spec has no auto-update: a new version is a new installer, downloaded
# by hand.
publish: null
